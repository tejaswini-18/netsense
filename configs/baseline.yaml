# Baseline experiment config (PRD section 7.3).
experiment_name: baseline
seed: 42

data:
  root: OPENABC2_DATASET    # dataset folder; override per machine (e.g. Kaggle input path)
  designs: [i2c, spi, fir, wb_dma]   # small-to-medium subset (docs/data_notes.md)
  split: random             # random | by_design | leave_one_design_out
  test_designs: [wb_dma]    # used by by_design / leave_one_design_out only
  val_fraction: 0.15
  test_fraction: 0.15       # random split only
  split_seed: 42            # fixed, so every run and seed uses the same split
  split_file: splits/baseline_random.json   # saved split (record + consistency check)
  targets: [and, delay]     # label columns: and | not | levels | area | delay
  target_mode: raw          # raw | ratio (ratio is tested in experiment 1)
  recipe_source: ss_pcm     # design whose files the 1500 recipes are read from

model:
  graph_encoder: gcn        # gcn | gin | sage
  graph_layers: 3
  recipe_encoder: cnn       # cnn | transformer
  hidden_dim: 64
  inputs: both              # both | graph_only | recipe_only (ablation)

training:
  lr: 0.001
  batch_size: 32
  max_epochs: 100
  early_stopping_patience: 10
  loss: mse                 # mse | mse_rank (adds a pairwise ranking loss)
  rank_weight: 1.0          # weight of the ranking loss when loss = mse_rank
  select_by: val_loss       # val_loss | val_tau: which validation score picks the best epoch
