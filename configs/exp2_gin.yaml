# Experiment 2: GIN graph encoder instead of GCN.
# The ONLY change from configs/baseline.yaml: model.graph_encoder: gcn -> gin
experiment_name: exp2_gin
seed: 42
data:
  root: OPENABC2_DATASET
  designs:
  - i2c
  - spi
  - fir
  - wb_dma
  split: random
  test_designs:
  - wb_dma
  val_fraction: 0.15
  test_fraction: 0.15
  split_seed: 42
  split_file: splits/baseline_random.json
  targets:
  - and
  - delay
  target_mode: raw
  recipe_source: ss_pcm
model:
  graph_encoder: gin
  graph_layers: 3
  recipe_encoder: cnn
  hidden_dim: 64
  inputs: both
training:
  lr: 0.001
  batch_size: 32
  max_epochs: 100
  early_stopping_patience: 10
  loss: mse
  rank_weight: 1.0
  select_by: val_loss
